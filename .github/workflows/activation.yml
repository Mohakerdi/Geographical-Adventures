name: Acquire Unity Activation File

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request Unity Activation (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request activation file
        id: get-activation-file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.2f1

      - name: Upload activation file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.get-activation-file.outputs.filePath }}
