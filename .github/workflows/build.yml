name: Build Game (Android & Linux Fedora)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildLinux:
    name: Build for Linux Fedora (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-
            Library-

      - name: Build StandaloneLinux64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 2021.3.2f1
          buildName: Geographical Adventures

      - name: Package Linux build
        run: |
          cd build/StandaloneLinux64
          zip -r ../../Geographical-Adventures-Linux-Fedora.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Linux-Fedora
          path: Geographical-Adventures-Linux-Fedora.zip
          retention-days: 14

  buildAndroid:
    name: Build for Android Phone (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          buildName: Geographical-Adventures
          androidAppBundle: false

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Android-APK
          path: build/Android/**/*.apk
          retention-days: 14
