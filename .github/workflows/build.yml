name: Build Game (Android, Linux & Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  buildLinux:
    name: Build for Linux Fedora (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-
            Library-

      - name: Build StandaloneLinux64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 2021.3.2f1
          buildName: Geographical Adventures

      - name: Package Linux build
        run: |
          cd build/StandaloneLinux64
          zip -r ../../Geographical-Adventures-Linux-Fedora.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Linux-Fedora
          path: Geographical-Adventures-Linux-Fedora.zip
          retention-days: 14

  buildAndroid:
    name: Build for Android Phone (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          buildName: Geographical-Adventures
          androidExportType: androidPackage

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Android-APK
          path: build/Android/**/*.apk
          retention-days: 14

  buildWindows:
    name: Build for Windows (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build StandaloneWindows64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 2021.3.2f1
          buildName: Geographical Adventures

      - name: Package Windows build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../Geographical-Adventures-Windows-x64.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Windows-x64
          path: Geographical-Adventures-Windows-x64.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [buildLinux, buildAndroid, buildWindows]
    if: always() && (needs.buildLinux.result == 'success' || needs.buildAndroid.result == 'success' || needs.buildWindows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download Linux Artifact
        if: needs.buildLinux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Geographical-Adventures-Linux-Fedora
          path: release-assets

      - name: Download Android Artifact
        if: needs.buildAndroid.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Geographical-Adventures-Android-APK
          path: release-assets

      - name: Download Windows Artifact
        if: needs.buildWindows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Geographical-Adventures-Windows-x64
          path: release-assets

      - name: Prepare Release Assets
        run: |
          find release-assets -type f -name "*.apk" -exec mv -f {} release-assets/ \;
          find release-assets -type f -name "*.zip" -exec mv -f {} release-assets/ \;
          find release-assets -mindepth 1 -type d -exec rm -rf {} + || true
          ls -la release-assets

      - name: Update git tag latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Create or Update GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### Geographical Adventures - Latest Builds
          Downloadable standalone builds for Android, Windows, and Linux:
          - **Android APK**: Download and install `Geographical-Adventures.apk` directly on your Android phone or tablet.
          - **Windows (64-bit)**: Download `Geographical-Adventures-Windows-x64.zip`, unzip and launch `Geographical Adventures.exe`.
          - **Linux (Fedora / Ubuntu / x86_64)**: Download `Geographical-Adventures-Linux-Fedora.zip`, unzip and run `./Geographical Adventures.x86_64`.

          **Highlights & Features:**
          - **Full Multiplatform Support**: Native Android APK, Windows x64 executable, and Linux x86_64 builds.
          - **Modern Arabic Typography (Cairo Font)**: Sleek, high-definition gaming font with 100% Arabic glyph coverage.
          - **Dedicated Mobile Controls in Settings**: Larger mobile buttons, responsive dynamic joystick, and customizable transient button opacity (20% to 100%).
          - **Clean Cockpit & Flight HUD**: Polished flight-avionics UI without corrupted glyphs or missing icons.
          - **Fixed Sun Shadows & High FPS**: Terminator shadow fixes and smooth 60+ FPS performance.
          - **Forced Landscape**: Native landscape lock on mobile devices.
          EOF

          BUILD_TAG="v0.1.${{ github.run_number }}"
          echo "Publishing versioned release: $BUILD_TAG"
          gh release create "$BUILD_TAG" release-assets/* \
            --title "Geographical Adventures $BUILD_TAG" \
            --notes-file release_notes.md || true

          echo "Updating rolling latest release..."
          gh release delete latest --yes || true
          git tag -f latest ${{ github.sha }}
          git push -f origin latest
          gh release create latest release-assets/* \
            --title "Geographical Adventures - Latest Build" \
            --notes-file release_notes.md \
            --latest
