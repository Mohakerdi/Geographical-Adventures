name: Build Game (Android & Linux Fedora)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  buildLinux:
    name: Build for Linux Fedora (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-
            Library-

      - name: Build StandaloneLinux64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: 2021.3.2f1
          buildName: Geographical Adventures

      - name: Package Linux build
        run: |
          cd build/StandaloneLinux64
          zip -r ../../Geographical-Adventures-Linux-Fedora.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Linux-Fedora
          path: Geographical-Adventures-Linux-Fedora.zip
          retention-days: 14

  buildAndroid:
    name: Build for Android Phone (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.2f1
          buildName: Geographical-Adventures
          androidExportType: androidPackage

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geographical-Adventures-Android-APK
          path: build/Android/**/*.apk
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [buildLinux, buildAndroid]
    if: always() && (needs.buildLinux.result == 'success' || needs.buildAndroid.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download Linux Artifact
        if: needs.buildLinux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Geographical-Adventures-Linux-Fedora
          path: release-assets

      - name: Download Android Artifact
        if: needs.buildAndroid.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Geographical-Adventures-Android-APK
          path: release-assets

      - name: List Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Geographical Adventures - Latest Build' }}
          body: |
            ### Geographical Adventures - Automatic Build
            Downloadable standalone builds for Linux and Android:
            - **Linux (Fedora / Ubuntu / x86_64)**: Download `Geographical-Adventures-Linux-Fedora.zip`, unzip and run `./Geographical Adventures.x86_64`.
            - **Android APK**: Download and install `Geographical-Adventures.apk` directly on your Android phone or tablet.

            **Features in this release:**
            - **New Syrian Flag**: Updated to the green-white-black flag with three red stars.
            - **Full Arabic Language Localization**: Menus, manual, credits, in-game stats, quest delivery feedback, and interactive globe country tooltips.
            - **Mobile Touch Controls**: Floating steering joystick, DROP, BOOST, throttle buttons, and top navigation bar.
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
